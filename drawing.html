<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAWING CENTER | STABLE MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #0a0a0a; --white: #ffffff; --blue: #00f2ff; --red: #ff4d4d; }
        body { background: #1a1a1a; font-family: 'Kanit', sans-serif; margin: 0; color: var(--white); padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #1a1a1a; padding: 20px; border-radius: 20px; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); text-align: center; box-sizing: border-box; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; text-align: left; }
        .full-col { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        input, select { background: #252525; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; font-family: 'Kanit'; font-size: 14px; width: 100%; box-sizing: border-box; }
        /* Style dropdown saat aktif meski match di-lock */
        select { border: 1px solid #444; cursor: pointer; }
        .absen-container { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .absen-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ccc; }
        #draw-list { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; min-height: 50px; transition: 0.5s ease; }
        .is-blind { filter: blur(20px) grayscale(1); pointer-events: none; user-select: none; }
        .draw-item { background: #252525; padding: 12px 15px; border-radius: 8px; border-left: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; font-size: 14px; text-align: left; }
        .rank { font-weight: 900; color: var(--gold); margin-right: 10px; }
        button { padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Kanit'; width: 100%; margin-bottom: 10px; }
        #btn-shuffle { background: var(--gold); color: black; }
        #btn-lock { background: var(--red); color: white; }
        #btn-wa { background: #25d366; color: white; display: none; text-decoration: none; align-items: center; justify-content: center; padding: 15px; border-radius: 8px; font-weight: bold; }
        .status-lock { color: var(--blue); margin-top: 15px; font-weight: bold; display: none; }
        textarea#teams {
        background: #252525;
        border: 1px solid #444;
        color: white;
        padding: 12px;
        border-radius: 8px;
        font-family: 'Kanit';
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
        resize: none; 
        height: 80px; /* Biar agak tinggi kotaknya */
        line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--gold); margin: 0 0 5px 0; font-size: 24px;">🎰 DRAWING CENTER</h1>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 10px;">
        <div id="sync-status" style="font-size: 10px; color: #555;">Menghubungkan...</div>
        <button onclick="manualSync()" style="width: auto; padding: 4px 12px; font-size: 10px; background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; cursor: pointer; font-family: 'Kanit';">REFRESH</button>
    </div>

    <div class="input-grid">
        <div class="input-group full-col">
            <label>Pilih Match</label>
            <select id="match-select" onchange="updateMatchDetails()"></select>
        </div>
        <div class="input-group"><label>Tanggal</label><input type="text" id="match-date" readonly></div>
        <div class="input-group"><label>Jam</label><input type="text" id="start-time" readonly></div>
        <div class="input-group full-col">
        <label>Tim yang Bertanding</label>
        <textarea id="teams" readonly maxlength="1000" placeholder="List tim..."></textarea>
        </div>
        <div class="input-group"><label>Durasi (Mnt)</label><input type="text" id="duration" readonly></div>
        <div class="input-group"><label>Saksi</label><input type="text" id="witness-name" readonly></div>
        <div class="input-group full-col">
            <label>Status Pemain</label>
            <div class="absen-container" id="absen-list-display"></div>
        </div>
    </div>

    <div id="draw-list" class="is-blind"></div>

    <div id="controls">
        <button id="btn-shuffle" onclick="shuffleData()">🔄 ACAK URUTAN (<span id="count">0</span>)</button>
        <button id="btn-lock" onclick="lockResult()">🔒 FIX & BUKA HASIL</button>
        <a id="btn-wa" href="#" onclick="shareToWA()">📲 KIRIM KE WHATSAPP</a>
        <a href="index.html" style="display: flex; align-items: center; justify-content: center; padding: 15px; background: #444; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; font-family: 'Kanit';">⬅️ KEMBALI KE BERANDA</a>
    </div>

    <div id="status" class="status-lock">✅ URUTAN SAH & TERKUNCI</div>
</div>

<script>
    const drawingSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=353274036&single=true&output=csv';
    const playerMaster = ["Dandi", "Asep", "Rizal", "Aries", "Ikmal", "Regi", "Yanti", "Erni", "Dicky", "Maya"];
    
    let allMatchesData = [];
    let shuffleCount = 0;
    let currentList = [];
    let isLocked = false;
    let globalAbsent = [];

    function initApp() {
        syncData();
        setInterval(syncData, 5000);
    }

    async function syncData() {
        try {
            const res = await fetch(`${drawingSheetUrl}&nocache=${new Date().getTime()}`);
            const csv = await res.text();
            const rows = csv.split('\n').slice(1).map(r => r.split(',').map(c => c.trim().replace(/"/g, '')));
            
            const resetFound = rows.some(row => row[7] && row[7].toUpperCase() === "RESET");
            if (resetFound) {
                hardReset();
                return;
            }

            allMatchesData = rows.filter(r => r[0] !== "");
            renderDropdown();
            document.getElementById('sync-status').innerText = "✅ Koneksi Stabil";
        } catch (e) { 
            document.getElementById('sync-status').innerText = "⚠️ Koneksi Terganggu";
        }
    }

    function renderDropdown() {
        const select = document.getElementById('match-select');
        const currentVal = select.value;
        
        let html = '<option value="">-- Pilih Match --</option>';
        allMatchesData.forEach((data, index) => {
            html += `<option value="${index}">${data[0]}</option>`;
        });

        if (select.innerHTML !== html) {
            select.innerHTML = html;
            if (currentVal !== "" && allMatchesData[currentVal]) {
                select.value = currentVal;
            }
        }
    }

    function updateMatchDetails() {
        const select = document.getElementById('match-select');
        const idx = select.value;
        
        if (idx === "" || !allMatchesData[idx]) {
            resetUIForNewMatch();
            return;
        }

        const data = allMatchesData[idx];
        document.getElementById('match-date').value = data[1];
        document.getElementById('teams').value = data[2];
        document.getElementById('start-time').value = data[3];
        document.getElementById('duration').value = data[4];
        document.getElementById('witness-name').value = data[5];

        // 1. Ambil data absen TERBARU dari Google Sheets
        const sheetAbsentRaw = data[6] ? data[6].split(';').map(n => n.trim()).filter(n => n !== "").sort().join(';') : "";
        globalAbsent = data[6] ? data[6].split(';').map(n => n.trim()) : [];
        
        const savedData = localStorage.getItem('match_lock_' + idx);
        
        if (savedData) {
            const parsed = JSON.parse(savedData);
            
            // 2. Cek data absen yang tersimpan di HP (kalau ada)
            // Kita bikin pembanding biar kalau lo ubah absen di Sheets, HP otomatis ngereset
            const localAbsentRaw = parsed.absentSnapshot || "";

            if (sheetAbsentRaw !== localAbsentRaw) {
                // JIKA ABSEN BERUBAH: Paksa reset khusus untuk match ini
                localStorage.removeItem('match_lock_' + idx);
                isLocked = false;
                currentList = [];
                shuffleCount = 0;
                resetUIForNewMatch();
                console.log("Data absen berubah, sistem otomatis unlock match ini.");
            } else {
                // JIKA ABSEN SAMA: Pakai data yang sudah terkunci
                currentList = parsed.list;
                shuffleCount = parsed.count;
                isLocked = true;
                applyLockUI();
            }
        } else {
            // BELUM ADA DATA TERKUNCI
            isLocked = false;
            currentList = [];
            shuffleCount = 0;
            resetUIForNewMatch();
        }

        renderAbsentStatus();
        renderList();
        document.getElementById('count').innerText = shuffleCount;
    }

    function renderAbsentStatus() {
        document.getElementById('absen-list-display').innerHTML = playerMaster.map(p => {
            const isAbs = globalAbsent.includes(p);
            return `<div class="absen-item" style="color:${isAbs ? '#ff4d4d' : '#00ff88'}">${isAbs ? '❌' : '✅'} ${p}</div>`;
        }).join('');
    }

    function calculateSchedule(startTimeStr, index, durationMinutes) {
        if(!startTimeStr || startTimeStr === "-" || startTimeStr === "") return { start: "00:00", end: "00:00" };
        let [h, m] = startTimeStr.split(':').map(Number);
        let startTotal = (h * 60 + m) + ((parseInt(durationMinutes) + 1) * index);
        let endTotal = startTotal + parseInt(durationMinutes);
        const fmt = (t) => `${Math.floor(t/60)%24}:${(t%60).toString().padStart(2,'0')}`;
        return { start: fmt(startTotal), end: fmt(endTotal) };
    }

    function shuffleData() {
        if (isLocked) return;
        document.getElementById('draw-list').classList.add('is-blind');
        let active = playerMaster.filter(p => !globalAbsent.includes(p)).sort(() => Math.random() - 0.5);
        let abs = globalAbsent.sort(() => Math.random() - 0.5);
        currentList = [...active, ...abs];
        shuffleCount++;
        document.getElementById('count').innerText = shuffleCount;
        renderList();
    }

    function renderList() {
        if (currentList.length === 0) {
            document.getElementById('draw-list').innerHTML = "";
            return;
        }
        const jm = document.getElementById('start-time').value;
        const dr = document.getElementById('duration').value;
        document.getElementById('draw-list').innerHTML = currentList.map((name, i) => {
            const isAbs = globalAbsent.includes(name);
            const t = calculateSchedule(jm, i, dr);
            return `<div class="draw-item" style="${isAbs ? 'opacity:0.5; border-left:red 5px solid;' : ''}">
                <span><span class="rank">#${i+1}</span> <b>${name.toUpperCase()}</b> 
                <span style="color:var(--gold);margin-left:8px">${isAbs ? '' : '('+t.start+'-'+t.end+')'}</span>
                ${isAbs ? '(ABSEN)' : ''}</span>
            </div>`;
        }).join('');
    }

    function lockResult() {
        const idx = document.getElementById('match-select').value;
        if (idx === "") return alert("Pilih match dulu!");
        if (currentList.length === 0) return alert("Belum ada urutan!");
        
        if (confirm("KUNCI HASIL MATCH INI?")) {
            isLocked = true;
            const dataToSave = {
                list: currentList,
                count: shuffleCount,
                // SIMPAN STATUS ABSEN SAAT INI SEBAGAI PENANDA
                absentSnapshot: globalAbsent.sort().join(';') 
            };
            localStorage.setItem('match_lock_' + idx, JSON.stringify(dataToSave));
            applyLockUI();
        }
    }

    function applyLockUI() {
        document.getElementById('draw-list').classList.remove('is-blind');
        document.getElementById('btn-shuffle').style.display = "none";
        document.getElementById('btn-lock').style.display = "none";
        // BARIS DIBAWAH INI GUE UBAH AGAR DROPDOWN TETAP BISA DIKLIK
        document.getElementById('match-select').disabled = false; 
        document.getElementById('status').style.display = "block";
        document.getElementById('btn-wa').style.display = "flex";
        renderList();
    }

    function resetUIForNewMatch() {
        isLocked = false;
        document.getElementById('draw-list').classList.add('is-blind');
        document.getElementById('btn-shuffle').style.display = "block";
        document.getElementById('btn-lock').style.display = "block";
        document.getElementById('match-select').disabled = false;
        document.getElementById('status').style.display = "none";
        document.getElementById('btn-wa').style.display = "none";
    }

    function shareToWA() {
        let m = "";
        const select = document.getElementById('match-select');
        if (select.selectedIndex > 0) {
            m = select.options[select.selectedIndex].text;
        } else {
            m = "MATCH TERKUNCI";
        }
                
        const tm = document.getElementById('teams').value.trim(); // Tambah trim biar gak ada spasi liar
        const tg = document.getElementById('match-date').value; 
        const jm = document.getElementById('start-time').value;
        const dr = document.getElementById('duration').value;
        const saksi = document.getElementById('witness-name').value;

        // Gunakan satu variabel string panjang, jangan pakai enter manual di dalam kode
        let rawMsg = "*" + m.toUpperCase() + "*\n";
        rawMsg += "*TIM:* " + tm.toUpperCase() + "\n";
        rawMsg += "*TGL:* " + tg.toUpperCase() + "\n\n";
        rawMsg += "⚖️ Saksi: " + saksi + "\n";
        rawMsg += "🎲 Acakan: " + shuffleCount + "x\n\n";
        rawMsg += "*HASIL DRAWING:*\n";
        
        currentList.forEach((name, i) => {
            const isAbs = globalAbsent.includes(name);
            const t = calculateSchedule(jm, i, dr);
            if (isAbs) {
                rawMsg += (i + 1) + ". " + name.toUpperCase() + " (ABSEN)\n";
            } else {
                rawMsg += (i + 1) + ". " + name.toUpperCase() + " [" + t.start + "-" + t.end + "]\n";
            }
        });
        
        // Encode total agar simbol || dan spasi aman
        const encodedMsg = encodeURIComponent(rawMsg);
        
        // Buka link WA
        window.open("https://wa.me/?text=" + encodedMsg, '_blank');
    }

    function hardReset() {
        localStorage.clear();
        alert("Sistem di-Reset Admin!");
        location.reload();
    }

    async function manualSync() {
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "⏳...";
        btn.disabled = true;
        await syncData();
        setTimeout(() => {
            btn.innerText = originalText;
            btn.disabled = false;
        }, 1000);
    }

    window.onload = initApp;
</script>
</body>
</html>
