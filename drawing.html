<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAWING CENTER | PRO MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #0a0a0a; --white: #ffffff; --blue: #00f2ff; --red: #ff4d4d; --yellow: #ffc107; }
        body { background: #1a1a1a; font-family: 'Kanit', sans-serif; margin: 0; color: var(--white); padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #1a1a1a; padding: 20px; border-radius: 20px; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); text-align: center; box-sizing: border-box; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; text-align: left; }
        .full-col { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        input, select { background: #252525; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; font-family: 'Kanit'; font-size: 14px; width: 100%; box-sizing: border-box; }
        select { border: 1px solid #444; cursor: pointer; }
        .absen-container { background: #111; padding: 12px; border-radius: 8px; border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .absen-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
        #draw-list { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; min-height: 50px; transition: 0.5s ease; }
        .is-blind { filter: blur(20px) grayscale(1); pointer-events: none; user-select: none; }
        .draw-item { background: #252525; padding: 12px 15px; border-radius: 8px; border-left: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; font-size: 14px; text-align: left; }
        .rank { font-weight: 900; color: var(--gold); margin-right: 10px; }
        button { padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Kanit'; width: 100%; margin-bottom: 10px; }
        #btn-shuffle { background: var(--gold); color: black; }
        #btn-lock { background: var(--red); color: white; }
        #btn-wa { background: #25d366; color: white; display: none; text-decoration: none; align-items: center; justify-content: center; padding: 15px; border-radius: 8px; font-weight: bold; }
        .status-lock { color: var(--blue); margin-top: 15px; font-weight: bold; display: none; }
        textarea#teams { background: #252525; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; font-family: 'Kanit'; font-size: 14px; width: 100%; box-sizing: border-box; resize: none; height: 60px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--gold); margin: 0 0 5px 0; font-size: 24px;">🎰 DRAWING CENTER</h1>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 10px;">
        <div id="sync-status" style="font-size: 10px; color: #555;">Menghubungkan...</div>
        <button onclick="manualSync(event)" style="width: auto; padding: 4px 12px; font-size: 10px; background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; cursor: pointer; font-family: 'Kanit';">REFRESH</button>
    </div>

    <div class="input-grid">
        <div class="input-group full-col">
            <label>Pilih Match</label>
            <select id="match-select" onchange="updateMatchDetails()"></select>
        </div>
        <div class="input-group"><label>Tanggal</label><input type="text" id="match-date" readonly></div>
        <div class="input-group"><label>Jam</label><input type="text" id="start-time" readonly></div>
        <div class="input-group full-col">
            <label>Tim yang Bertanding</label>
            <textarea id="teams" readonly></textarea>
        </div>
        <div class="input-group"><label>Durasi (Mnt)</label><input type="text" id="duration" readonly></div>
        <div class="input-group"><label>Saksi</label><input type="text" id="witness-name" readonly></div>
        <div class="input-grid full-col" style="margin-bottom:0px;">
            <div class="input-group full-col">
                <label>Status Pemain</label>
                <div class="absen-container" id="absen-list-display"></div>
            </div>
        </div>
    </div>

    <div id="draw-list" class="is-blind"></div>

    <div id="controls">
        <button id="btn-shuffle" onclick="shuffleData()">🔄 ACAK URUTAN (<span id="count">0</span>)</button>
        <button id="btn-lock" onclick="lockResult()">🔒 FIX & BUKA HASIL</button>
        <a id="btn-wa" href="#" onclick="shareToWA()">📲 KIRIM KE WHATSAPP</a>
        <a href="index.html" style="display: flex; align-items: center; justify-content: center; padding: 15px; background: #444; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; font-family: 'Kanit';">⬅️ KEMBALI KE BERANDA</a>
    </div>

    <div id="status" class="status-lock">✅ URUTAN SAH & TERKUNCI</div>
</div>

<script>
    const drawingSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=353274036&single=true&output=csv';
    const masterSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=0&single=true&output=csv';

    const playerMaster = ["Dandi", "Asep", "Rizal", "Aries", "Ikmal", "Regi", "Yanti", "Erni", "Dicky", "Maya"];
    
    let allMatchesData = [];
    let shuffleCount = 0;
    let currentList = [];
    let isLocked = false;
    let globalAbsent = []; 
    let yellowCardData = []; 
    let playerCardMap = {}; 

    function initApp() {
        syncData();
        setInterval(syncData, 5000);
    }

    function parseCSVLine(line) {
        let result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim().replace(/^"|"$/g, ''));
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
    }

    async function syncData() {
        try {
            // Ambil Data Match (Sheet2)
            const resMatch = await fetch(`${drawingSheetUrl}&nocache=${new Date().getTime()}`);
            const csvMatch = await resMatch.text();
            const rowsMatch = csvMatch.split('\n').filter(l => l.trim() !== '').slice(1).map(parseCSVLine);
            
            // Pengaman Reset Otomatis: Hanya cek jika tulisan RESET ada di Kolom H Baris ke-2 (Indeks 7)
            if (rowsMatch[0] && rowsMatch[0][7] && rowsMatch[0][7].toUpperCase().trim() === "RESET") { 
                hardReset(); 
                return; 
            }

            // Memisahkan baris murni berawalan kata MATCH
            allMatchesData = rowsMatch.filter(r => r[0] && r[0].trim() !== "" && r[0].toUpperCase().startsWith("MATCH"));

            // Ambil Data Kartu Kuning (Sheet1)
            const resMaster = await fetch(`${masterSheetUrl}&nocache=${new Date().getTime()}`);
            const csvMaster = await resMaster.text();
            const rowsMaster = csvMaster.split('\n').filter(l => l.trim() !== '').slice(1).map(parseCSVLine);

            playerCardMap = {};
            yellowCardData = [];

            playerMaster.forEach(p => {
                const row = rowsMaster.find(r => r[0] && r[0].toLowerCase().trim() === p.toLowerCase().trim());
                if (row && row[7]) { 
                    const cardCount = parseInt(row[7]) || 0;
                    playerCardMap[p] = cardCount;
                    if (cardCount >= 2) { yellowCardData.push(p); }
                } else {
                    playerCardMap[p] = 0;
                }
            });

            renderDropdown();
            document.getElementById('sync-status').innerText = "✅ Koneksi Stabil";
        } catch (e) { 
            document.getElementById('sync-status').innerText = "⚠️ Koneksi Terganggu";
        }
    }

    function renderDropdown() {
        const select = document.getElementById('match-select');
        const currentVal = select.value;
        let html = '<option value="">-- Pilih Match --</option>';
        
        allMatchesData.forEach((data, index) => { 
            html += `<option value="${index}">${data[0].toUpperCase()}</option>`; 
        });

        if (select.innerHTML !== html) {
            select.innerHTML = html;
            if (currentVal !== "" && allMatchesData[currentVal]) { select.value = currentVal; }
        }
    }

    function updateMatchDetails() {
        const select = document.getElementById('match-select');
        const idx = select.value;
        if (idx === "" || !allMatchesData[idx]) { resetUIForNewMatch(); return; }

        const data = allMatchesData[idx];
        document.getElementById('match-date').value = data[1] || '';
        document.getElementById('teams').value = data[2] || '';
        document.getElementById('start-time').value = data[3] || '';
        document.getElementById('duration').value = data[4] || '';
        document.getElementById('witness-name').value = data[5] || '';

        // Membaca Kolom G (Indeks ke-6) sebagai kolom data Absen yang valid
        const sheetAbsentRaw = data[6] ? data[6].split(';').map(n => n.trim()).filter(n => n !== "").sort().join(';') : "";
        globalAbsent = data[6] ? data[6].split(';').map(n => n.trim()).filter(n => n !== "") : [];
        
        const savedData = localStorage.getItem('match_lock_' + idx);
        if (savedData) {
            const parsed = JSON.parse(savedData);
            if (sheetAbsentRaw !== (parsed.absentSnapshot || "")) {
                localStorage.removeItem('match_lock_' + idx);
                resetUIForNewMatch();
            } else {
                currentList = parsed.list;
                shuffleCount = parsed.count;
                isLocked = true;
                applyLockUI();
            }
        } else {
            resetUIForNewMatch();
        }

        renderAbsentStatus();
        renderList();
        document.getElementById('count').innerText = shuffleCount;
    }

    function renderAbsentStatus() {
        document.getElementById('absen-list-display').innerHTML = playerMaster.map(p => {
            const isAbs = globalAbsent.some(name => name.toLowerCase().trim() === p.toLowerCase().trim());
            const isYel = yellowCardData.some(name => name.toLowerCase().trim() === p.toLowerCase().trim());
            
            let currentStyle = '#00ff88'; 
            let labelStatus = 'MAIN';
            if (isYel) { currentStyle = 'var(--red)'; labelStatus = 'AKUMULASI'; } 
            else if (isAbs) { currentStyle = 'var(--yellow)'; labelStatus = 'ABSEN'; }

            return `<div class="absen-item" style="color:${currentStyle}">● ${labelStatus} ${p.toUpperCase()}</div>`;
        }).join('');
    }

    function calculateSchedule(startStr, index, durMins) {
        if(!startStr || startStr === "-") return { start: "00:00", end: "00:00" };
        let [h, m] = startStr.split(':').map(Number);
        let startTotal = (h * 60 + m) + ((parseInt(durMins) + 1) * index);
        let endTotal = startTotal + parseInt(durMins);
        const fmt = (t) => `${Math.floor(t/60)%24}:${(t%60).toString().padStart(2,'0')}`;
        return { start: fmt(startTotal), end: fmt(endTotal) };
    }

    function shuffleData() {
        if (isLocked) return;
        document.getElementById('draw-list').classList.add('is-blind');
        
        let active = playerMaster.filter(p => !globalAbsent.some(x => x.toLowerCase().trim() === p.toLowerCase().trim()) && !yellowCardData.some(x => x.toLowerCase().trim() === p.toLowerCase().trim())).sort(() => Math.random() - 0.5);
        let abs = playerMaster.filter(p => globalAbsent.some(x => x.toLowerCase().trim() === p.toLowerCase().trim()) && !yellowCardData.some(x => x.toLowerCase().trim() === p.toLowerCase().trim())).sort(() => Math.random() - 0.5);
        let yel = playerMaster.filter(p => yellowCardData.some(x => x.toLowerCase().trim() === p.toLowerCase().trim())).sort(() => Math.random() - 0.5);
        
        currentList = [...active, ...abs, ...yel];
        shuffleCount++;
        document.getElementById('count').innerText = shuffleCount;
        renderList();
    }

    function renderList() {
        if (currentList.length === 0) { document.getElementById('draw-list').innerHTML = ""; return; }
        const jm = document.getElementById('start-time').value;
        const dr = document.getElementById('duration').value;
        
        document.getElementById('draw-list').innerHTML = currentList.map((name, i) => {
            const isYel = yellowCardData.some(x => x.toLowerCase().trim() === name.toLowerCase().trim());
            const isAbs = globalAbsent.some(x => x.toLowerCase().trim() === name.toLowerCase().trim());
            const totalCards = playerCardMap[name] || 0;

            let cardsHTML = "";
            for (let j = 0; j < Math.min(totalCards, 3); j++) {
                cardsHTML += `<span style="display:inline-block; width:10px; height:14px; background:#facc15; border-radius:2px; margin-left:5px; border:1px solid rgba(0,0,0,0.4); vertical-align: middle;"></span>`;
            }

            const t = calculateSchedule(jm, i, dr);
            
            let itemStyle = "border-left: 5px solid var(--gold);";
            let textColor = "white";
            let timeHTML = `<span style="color:var(--gold);margin-left:8px">( ${t.start} - ${t.end} )</span>`;

            if (isYel) {
                itemStyle = "opacity:0.3; border-left: 5px solid var(--red); background: rgba(255, 77, 77, 0.05);";
                textColor = "var(--red)";
                timeHTML = "";
            } else if (isAbs) {
                // Sesuai request: Tampilan web orang absen (Regi) dibuat bersih & normal, dapet porsi durasi waktu
                itemStyle = "border-left: 5px solid var(--yellow);";
                textColor = "white"; 
                timeHTML = `<span style="color:var(--gold);margin-left:8px">( ${t.start} - ${t.end} )</span>`;
            }

            return `<div class="draw-item" style="${itemStyle}">
                <span style="color:${textColor}; flex-grow:1;"><span class="rank" style="${isYel ? 'color:'+textColor : ''}">#${i+1}</span> <b style="letter-spacing:0.5px">${name.toUpperCase()}</b>${cardsHTML} ${timeHTML}</span>
            </div>`;
        }).join('');
    }

    function lockResult() {
        const idx = document.getElementById('match-select').value;
        if (idx === "" || currentList.length === 0) return alert("Pilih match / acak dulu!");
        if (confirm("KUNCI HASIL MATCH INI?")) {
            isLocked = true;
            localStorage.setItem('match_lock_' + idx, JSON.stringify({ list: currentList, count: shuffleCount, absentSnapshot: globalAbsent.sort().join(';') }));
            applyLockUI();
        }
    }

    function applyLockUI() {
        document.getElementById('draw-list').classList.remove('is-blind');
        document.getElementById('btn-shuffle').style.display = "none";
        document.getElementById('btn-lock').style.display = "none";
        document.getElementById('status').style.display = "block";
        document.getElementById('btn-wa').style.display = "flex";
        renderList();
    }

    function resetUIForNewMatch() {
        isLocked = false;
        shuffleCount = 0;
        currentList = [];
        document.getElementById('draw-list').classList.add('is-blind');
        document.getElementById('btn-shuffle').style.display = "block";
        document.getElementById('btn-lock').style.display = "block";
        document.getElementById('status').style.display = "none";
        document.getElementById('btn-wa').style.display = "none";
    }

    function shareToWA() {
        const select = document.getElementById('match-select');
        let m = select.selectedIndex > 0 ? select.options[select.selectedIndex].text : "MATCH TERKUNCI";
        let rawMsg = "*" + m.toUpperCase() + "*\n*TIM:* " + document.getElementById('teams').value.toUpperCase() + "\n*TGL:* " + document.getElementById('match-date').value.toUpperCase() + "\n\n⚖️ Saksi: " + document.getElementById('witness-name').value + "\n🎲 Acakan: " + shuffleCount + "x\n\n*HASIL DRAWING: * \n";
        
        currentList.forEach((name, i) => {
            const t = calculateSchedule(document.getElementById('start-time').value, i, document.getElementById('duration').value);
            if (yellowCardData.some(x => x.toLowerCase().trim() === name.toLowerCase().trim())) {
                rawMsg += `${i+1}. ${name.toUpperCase()} (AKUMULASI KARTU)\n`;
            } else {
                // Sesuai request: Orang absen tidak ditandai teks "(ABSEN)" sama sekali pada pesan teks WA
                rawMsg += `${i+1}. ${name.toUpperCase()} [${t.start}-${t.end}]\n`;
            }
        });
        window.open("https://wa.me/?text=" + encodeURIComponent(rawMsg), '_blank');
    }

    function hardReset() { 
        localStorage.clear(); 
        alert("Sistem berhasil di-RESET otomatis oleh Admin via Google Sheets!"); 
        location.reload(); 
    }
    
    async function manualSync(e) { 
        const btn = e.target; 
        btn.innerText = "⏳..."; 
        await syncData(); 
        btn.innerText = "REFRESH"; 
    }

    window.onload = initApp;
</script>
</body>
</html>
