<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD CUP 2026 EDITION - LEAGUE-I</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #161b22;
            --accent: #facc15;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 { color: var(--accent); text-shadow: 0 0 10px rgba(250, 204, 21, 0.3); margin-bottom: 5px; }
        .subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 30px; letter-spacing: 2px; }

        .wc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }

        .player-name { font-size: 18px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--accent); padding-bottom: 8px; display: block; }
        .team-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }

        .country-box { width: 50px; text-align: center; }
        .country-box.gugur { filter: grayscale(100%); opacity: 0.5; }
        .flag-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 3px; }
        .country-name { font-size: 8px; font-weight: bold; display: block; margin-top: 4px; color: var(--text-dim); }

        /* Leaderboard Section */
        .section-container {
            margin: 40px auto;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(250, 204, 21, 0.2);
        }

        .l-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .l-table th { background: rgba(250, 204, 21, 0.1); color: var(--accent); padding: 12px; border-bottom: 2px solid var(--accent); }
        .l-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* Group Detail Style */
        .manager-detail-card {
            background: #1c2128;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border-left: 4px solid var(--accent);
        }
        .manager-header {
            background: rgba(250, 204, 21, 0.1);
            padding: 10px 15px;
            text-align: left;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
        }
        
        .btn-back { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <button class="btn-back" onclick="window.location.href='index.html'">⬅ BACK TO HOME</button>
    
    <h1>WORLD CUP 2026 EDITION</h1>
    <p class="subtitle">MANAGER & TEAM ANALYTICS</p>

    <div id="wc-container" class="wc-grid"></div>

    <div class="section-container">
        <h2 style="color: var(--accent); margin-bottom: 15px;">OVERALL MANAGER STANDINGS</h2>
        <div style="overflow-x: auto;">
            <table class="l-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th style="text-align: left;">MANAGER</th>
                        <th>P</th><th>M</th><th>S</th><th>K</th>
                        <th style="color: #4ade80;">PTS</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-manager"></tbody>
            </table>
        </div>
    </div>

    <div class="section-container" style="background: transparent; border: none; padding: 0;">
        <h2 style="color: var(--accent); margin-bottom: 15px;">TEAM BREAKDOWN PER MANAGER</h2>
        <div id="detailed-teams-container"></div>
    </div>

    <script>
        const WC_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=1875833446&single=true&output=csv';

        const countryCodes = {
            "amerika serikat": "us", "meksiko": "mx", "kanada": "ca", "prancis": "fr", 
            "spanyol": "es", "argentina": "ar", "inggris": "gb", "portugal": "pt", "brasil": "br", "belanda": "nl",
            "belgia": "be", "jerman": "de", "kroasia": "hr", "maroko": "ma", "kolombia": "co", 
            "uruguay": "uy", "swiss": "ch", "jepang": "jp", "senegal": "sn", "iran": "ir",
            "korea selatan": "kr", "ekuador": "ec", "australia": "au", "norwegia": "no", 
            "panama": "pa", "mesir": "eg", "aljazair": "dz", "skotlandia": "gb-sct", "paraguay": "py", "austria": "at",
            "tunisia": "tn", "pantai gading": "ci", "uzbekistan": "uz", "qatar": "qa", "arab saudi": "sa", "yordania": "jo", "tanjung verde": "cv", "ghana": "gh", "curacao": "cw", "afrika selatan": "za",
            "haiti": "ht", "selandia baru": "nz", "swedia": "se", "turki": "tr", "ceko": "cz", "bosnia & herzegovina": "ba", "irak": "iq", "dr kongo": "cd"
        };

        async function loadWorldCup() {
            try {
                const res = await fetch(`${WC_SHEET_URL}&nocache=${new Date().getTime()}`);
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);
                
                const container = document.getElementById('wc-container');
                const managerBody = document.getElementById('leaderboard-manager');
                const detailedContainer = document.getElementById('detailed-teams-container');
                
                container.innerHTML = ""; managerBody.innerHTML = ""; detailedContainer.innerHTML = "";

                let allData = [];

                rows.forEach(line => {
                    const col = line.split(',').map(c => c.trim().replace(/"/g, ''));
                    if (!col[0]) return;

                    let managerObj = { 
                        name: col[0], 
                        teams: [], 
                        totalPts: 0, totalP: 0, totalM: 0, totalS: 0, totalK: 0 
                    };

                    let teamsHTML = "";

                    for (let i = 1; i <= 10; i += 2) {
                        const negara = col[i];
                        const statusRaw = col[i+1] ? col[i+1].toLowerCase() : "0-0-0 (aktif)";
                        if (!negara) continue;

                        const parts = statusRaw.split(' ')[0].split('-');
                        let w = parseInt(parts[0]) || 0;
                        let d = parseInt(parts[1]) || 0;
                        let l = parseInt(parts[2]) || 0;
                        let pts = (w * 3) + (d * 1);

                        managerObj.teams.push({ name: negara, p: (w+d+l), w, d, l, pts, raw: statusRaw });
                        managerObj.totalPts += pts;
                        managerObj.totalP += (w+d+l);
                        managerObj.totalM += w;
                        managerObj.totalS += d;
                        managerObj.totalK += l;

                        teamsHTML += `
                            <div class="country-box ${statusRaw.includes("gugur") ? "gugur" : ""}">
                                <img src="https://flagcdn.com/w80/${countryCodes[negara.toLowerCase()] || "un"}.png" class="flag-img">
                                <span class="country-name">${negara}</span>
                            </div>`;
                    }
                    allData.push(managerObj);
                    container.innerHTML += `<div class="player-card"><span class="player-name">${managerObj.name}</span><div class="team-list">${teamsHTML}</div></div>`;
                });

                // Sort Manager by Points
                allData.sort((a, b) => b.totalPts - a.totalPts);

                allData.forEach((m, idx) => {
                    // 1. Fill Manager Table
                    managerBody.innerHTML += `<tr><td>${idx+1}</td><td style="text-align:left">${m.name}</td><td>${m.totalP}</td><td>${m.totalM}</td><td>${m.totalS}</td><td>${m.totalK}</td><td style="font-weight:bold;color:#4ade80">${m.totalPts}</td></tr>`;

                    // 2. Fill Detailed Breakdown
                    let teamRows = m.teams.map(t => `
                        <tr>
                            <td style="text-align:left"><b>${t.name}</b></td>
                            <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
                            <td style="font-weight:bold;color:#4ade80">${t.pts}</td>
                        </tr>`).join('');

                    detailedContainer.innerHTML += `
                        <div class="manager-detail-card">
                            <div class="manager-header">
                                <span>MANAGER: ${m.name}</span>
                                <span>TOTAL: ${m.totalPts} PTS</span>
                            </div>
                            <table class="l-table">
                                <thead><tr><th style="text-align:left">NEGARA</th><th>P</th><th>M</th><th>S</th><th>K</th><th>PTS</th></tr></thead>
                                <tbody>${teamRows}</tbody>
                            </table>
                        </div>`;
                });

            } catch (e) { console.error(e); }
        }
        window.onload = loadWorldCup;
        setInterval(loadWorldCup, 60000);
    </script>
</body>
</html>
