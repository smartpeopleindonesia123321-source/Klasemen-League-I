<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD CUP 2026 EDITION - LEAGUE-I</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #161b22;
            --accent: #facc15; /* Kuning Emas */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .wc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .player-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .player-name {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(250, 204, 21, 0.2);
            padding-bottom: 8px;
            display: block;
        }

        .team-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .country-box {
            width: 55px;
            text-align: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .country-box.gugur {
            filter: grayscale(100%) brightness(70%);
            opacity: 0.6;
        }
        
        .country-box.gugur:hover {
            filter: grayscale(0%);
            opacity: 1;
        }

        .country-box.juara-1 { border: 2px solid #ffd700; border-radius: 6px; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); transform: scale(1.05); }
        .country-box.juara-2 { border: 2px solid #c0c0c0; border-radius: 6px; }
        .country-box.juara-3 { border: 2px solid #cd7f32; border-radius: 6px; }

        .flag-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .country-name {
            font-size: 9px;
            font-weight: bold;
            display: block;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-dim);
        }

        .status-badge {
            font-size: 7px;
            padding: 2px 4px;
            border-radius: 3px;
            margin-top: 4px;
            display: block;
            font-weight: 900;
            text-transform: uppercase;
        }

        .gugur .status-badge { background: #ff4444; color: white; }
        .juara-1 .status-badge { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); color: #000; }

        .btn-back {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-back:hover { background: var(--accent); color: black; }

        /* Leaderboard Style */
        .leaderboard-section {
            margin: 50px auto;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(250, 204, 21, 0.2);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
            font-size: 14px;
        }

        .leaderboard-table th {
            background: rgba(250, 204, 21, 0.1);
            color: var(--accent);
            padding: 12px;
            border-bottom: 2px solid var(--accent);
        }

        .leaderboard-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 600px) {
            .wc-grid { grid-template-columns: 1fr; }
            .country-box { width: 50px; }
        }
    </style>
</head>
<body>

    <button class="btn-back" onclick="window.location.href='index.html'">⬅ KEMBALI KE KLASEMEN</button>
    
    <h1>WORLD CUP 2026 EDITION</h1>
    <p class="subtitle">LAST MAN STANDING SYSTEM • 48 TEAMS</p>

    <div id="wc-container" class="wc-grid">
        <p style="color: var(--accent);">Menghubungkan ke satelit World Cup...</p>
    </div>

    <div class="leaderboard-section">
        <h2 style="color: var(--accent); text-transform: uppercase; margin-bottom: 5px;">Manager Standings</h2>
        <p style="font-size: 11px; color: var(--text-dim); margin-bottom: 20px;">POIN GABUNGAN (MENANG: 3, SERI: 1, KALAH: 0)</p>
        <div style="overflow-x: auto;">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th style="text-align: left;">MANAGER</th>
                        <th>P</th>
                        <th>M</th>
                        <th>S</th>
                        <th>K</th>
                        <th style="color: #4ade80;">PTS</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const WC_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=1875833446&single=true&output=csv';

        const countryCodes = {
            "amerika serikat": "us", "meksiko": "mx", "kanada": "ca", "prancis": "fr", 
            "spanyol": "es", "argentina": "ar", "inggris": "gb", "portugal": "pt", "brasil": "br", "belanda": "nl",
            "belgia": "be", "jerman": "de", "kroasia": "hr", "maroko": "ma", "kolombia": "co", 
            "uruguay": "uy", "swiss": "ch", "jepang": "jp", "senegal": "sn", "iran": "ir",
            "korea selatan": "kr", "ekuador": "ec", "australia": "au", "norwegia": "no", 
            "panama": "pa", "mesir": "eg", "aljazair": "dz", "skotlandia": "gb-sct", "paraguay": "py", "austria": "at",
            "tunisia": "tn", "pantai gading": "ci", "uzbekistan": "uz", "qatar": "qa", "arab saudi": "sa", "yordania": "jo", "tanjung verde": "cv", "ghana": "gh", "curacao": "cw", "afrika selatan": "za",
            "haiti": "ht", "selandia baru": "nz", "swedia": "se", "turki": "tr", "ceko": "cz", "bosnia & herzegovina": "ba", "irak": "iq", "dr kongo": "cd"
        };

        function getFlag(name) {
            const cleanName = name.toLowerCase().trim();
            const code = countryCodes[cleanName] || "un"; 
            return `https://flagcdn.com/w80/${code}.png`;
        }

        async function loadWorldCup() {
            try {
                const res = await fetch(`${WC_SHEET_URL}&nocache=${new Date().getTime()}`);
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);
                
                const container = document.getElementById('wc-container');
                const leaderboardBody = document.getElementById('leaderboard-body');
                
                container.innerHTML = "";
                leaderboardBody.innerHTML = "";

                let managerScores = [];

                rows.forEach(line => {
                    const col = line.split(',').map(c => c.trim().replace(/"/g, ''));
                    if (!col[0]) return;

                    const namaOrang = col[0];
                    let teamsHTML = "";
                    let m_pts = 0, m_win = 0, m_draw = 0, m_lose = 0, m_play = 0;

                    for (let i = 1; i <= 10; i += 2) {
                        const negara = col[i];
                        const statusRaw = col[i+1] ? col[i+1].toLowerCase() : "0-0-0 (aktif)";
                        if (!negara) continue;

                        // Hitung Poin
                        const statPart = statusRaw.split(' ')[0];
                        const parts = statPart.split('-');
                        if(parts.length === 3) {
                            const w = parseInt(parts[0]) || 0;
                            const d = parseInt(parts[1]) || 0;
                            const l = parseInt(parts[2]) || 0;
                            m_win += w; m_draw += d; m_lose += l;
                            m_play += (w + d + l);
                            m_pts += (w * 3) + (d * 1);
                        }

                        // UI Status
                        const isGugur = statusRaw.includes("gugur");
                        const isJuara1 = statusRaw.includes("juara 1");
                        const statusClass = isGugur ? "gugur" : (isJuara1 ? "juara-1" : "");
                        const badgeHTML = isGugur ? '<span class="status-badge">ELIMINATED</span>' : (isJuara1 ? '<span class="status-badge">WINNER 🏆</span>' : "");

                        teamsHTML += `
                            <div class="country-box ${statusClass}">
                                <img src="${getFlag(negara)}" class="flag-img" onerror="this.src='https://flagcdn.com/w80/un.png'">
                                <span class="country-name">${negara}</span>
                                ${badgeHTML}
                            </div>
                        `;
                    }

                    managerScores.push({ name: namaOrang, p: m_play, w: m_win, d: m_draw, l: m_lose, pts: m_pts });

                    container.innerHTML += `
                        <div class="player-card">
                            <span class="player-name">${namaOrang}</span>
                            <div class="team-list">${teamsHTML}</div>
                        </div>
                    `;
                });

                managerScores.sort((a, b) => b.pts - a.pts);
                managerScores.forEach((m, idx) => {
                    leaderboardBody.innerHTML += `
                        <tr>
                            <td style="font-weight: bold; color: var(--accent);">${idx + 1}</td>
                            <td style="text-align: left;">${m.name}</td>
                            <td>${m.p}</td><td>${m.w}</td><td>${m.d}</td><td>${m.l}</td>
                            <td style="font-weight: bold; color: #4ade80;">${m.pts}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('wc-container').innerHTML = "<p>Gagal memuat data.</p>";
            }
        }

        window.onload = loadWorldCup;
        setInterval(loadWorldCup, 60000);
    </script>
</body>
</html>
