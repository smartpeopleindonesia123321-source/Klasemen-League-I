<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD CUP 2026 EDITION - LEAGUE-I</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #161b22;
            --accent: #facc15; /* Kuning Emas */
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        <h1>WORLD CUP 2026 EDITION</h1>
    <p class="subtitle">LAST MAN STANDING SYSTEM • 48 TEAMS</p>

    <div id="wc-container" class="wc-grid">
        <p style="color: var(--accent);">Menghubungkan ke satelit World Cup...</p>
    </div>

    <div class="leaderboard-section" style="margin-top: 50px; max-width: 1000px; margin-left: auto; margin-right: auto; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(250, 204, 21, 0.2);">
        <h2 style="color: var(--accent); text-transform: uppercase; margin-bottom: 5px;">Manager Standings</h2>
        <p style="font-size: 11px; color: var(--text-dim); margin-bottom: 20px;">POIN GABUNGAN (MENANG: 3, SERI: 1, KALAH: 0)</p>
        
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; color: white; font-size: 14px;">
                <thead>
                    <tr style="background: rgba(250, 204, 21, 0.1); color: var(--accent);">
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent);">RANK</th>
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent); text-align: left;">MANAGER</th>
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent);">P</th>
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent);">M</th>
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent);">S</th>
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent);">K</th>
                        <th style="padding: 12px; border-bottom: 2px solid var(--accent); color: #4ade80;">PTS</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const WC_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=1875833446&single=true&output=csv';

        const countryCodes = {
            "amerika serikat": "us", "meksiko": "mx", "kanada": "ca", "prancis": "fr", 
            "spanyol": "es", "argentina": "ar", "inggris": "gb", "portugal": "pt", "brasil": "br", "belanda": "nl",
            "belgia": "be", "jerman": "de", "kroasia": "hr", "maroko": "ma", "kolombia": "co", 
            "uruguay": "uy", "swiss": "ch", "jepang": "jp", "senegal": "sn", "iran": "ir",
            "korea selatan": "kr", "ekuador": "ec", "australia": "au", "norwegia": "no", 
            "panama": "pa", "mesir": "eg", "aljazair": "dz", "skotlandia": "gb-sct", "paraguay": "py", "austria": "at",
            "tunisia": "tn", "pantai gading": "ci", "uzbekistan": "uz", "qatar": "qa", "arab saudi": "sa", "yordania": "jo", "tanjung verde": "cv", "ghana": "gh", "curacao": "cw", "afrika selatan": "za",
            "haiti": "ht", "selandia baru": "nz", "swedia": "se", "turki": "tr", "ceko": "cz", "bosnia & herzegovina": "ba", "irak": "iq", "dr kongo": "cd"
        };

        function getFlag(name) {
            const cleanName = name.toLowerCase().trim();
            const code = countryCodes[cleanName] || "un"; 
            return `https://flagcdn.com/w80/${code}.png`;
        }

        async function loadWorldCup() {
            try {
                const res = await fetch(`${WC_SHEET_URL}&nocache=${new Date().getTime()}`);
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);
                
                const container = document.getElementById('wc-container');
                const leaderboardBody = document.getElementById('leaderboard-body');
                
                container.innerHTML = "";
                leaderboardBody.innerHTML = "";

                let managerScores = [];

                rows.forEach(line => {
                    const col = line.split(',').map(c => c.trim().replace(/"/g, ''));
                    if (!col[0]) return;

                    const namaOrang = col[0];
                    let teamsHTML = "";
                    
                    // Variabel Hitung Poin Manager
                    let m_pts = 0, m_win = 0, m_draw = 0, m_lose = 0, m_play = 0;

                    for (let i = 1; i <= 10; i += 2) {
                        const negara = col[i];
                        const statusRaw = col[i+1] ? col[i+1].toLowerCase() : "0-0-0 (aktif)";
                        
                        if (!negara) continue;

                        // LOGIKA HITUNG POIN (M-S-K)
                        const statPart = statusRaw.split(' ')[0]; // Ambil "M-S-K"
                        const parts = statPart.split('-');
                        if(parts.length === 3) {
                            const w = parseInt(parts[0]) || 0;
                            const d = parseInt(parts[1]) || 0;
                            const l = parseInt(parts[2]) || 0;
                            m_win += w; m_draw += d; m_lose += l;
                            m_play += (w + d + l);
                            m_pts += (w * 3) + (d * 1);
                        }

                        // LOGIKA UI CARD
                        const isGugur = statusRaw.includes("gugur");
                        const isJuara1 = statusRaw.includes("juara 1");
                        const isJuara2 = statusRaw.includes("juara 2");
                        const isJuara3 = statusRaw.includes("juara 3");

                        let statusClass = isGugur ? "gugur" : (isJuara1 ? "juara-1" : (isJuara2 ? "juara-2" : (isJuara3 ? "juara-3" : "")));
                        let badgeHTML = isGugur ? '<span class="status-badge">ELIMINATED</span>' : (isJuara1 ? '<span class="status-badge">WINNER 🏆</span>' : "");

                        teamsHTML += `
                            <div class="country-box ${statusClass}">
                                <img src="${getFlag(negara)}" class="flag-img" onerror="this.src='https://flagcdn.com/w80/un.png'">
                                <span class="country-name">${negara}</span>
                                ${badgeHTML}
                            </div>
                        `;
                    }

                    // Push ke Array untuk Sorting Klasemen
                    managerScores.push({ name: namaOrang, p: m_play, w: m_win, d: m_draw, l: m_lose, pts: m_pts });

                    container.innerHTML += `
                        <div class="player-card">
                            <span class="player-name">${namaOrang}</span>
                            <div class="team-list">${teamsHTML}</div>
                        </div>
                    `;
                });

                // SORTING BERDASARKAN POIN TERTINGGI
                managerScores.sort((a, b) => b.pts - a.pts);

                // RENDER KE TABEL KLASEMEN
                managerScores.forEach((m, idx) => {
                    leaderboardBody.innerHTML += `
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                            <td style="padding: 12px; font-weight: bold; color: var(--accent);">${idx + 1}</td>
                            <td style="padding: 12px; text-align: left;">${m.name}</td>
                            <td style="padding: 12px;">${m.p}</td>
                            <td style="padding: 12px;">${m.w}</td>
                            <td style="padding: 12px;">${m.d}</td>
                            <td style="padding: 12px;">${m.l}</td>
                            <td style="padding: 12px; font-weight: bold; color: #4ade80;">${m.pts}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error WC:", error);
                document.getElementById('wc-container').innerHTML = "<p>Gagal memuat data.</p>";
            }
        }

        window.onload = loadWorldCup;
        setInterval(loadWorldCup, 60000);
    </script>
</body>
</html>
