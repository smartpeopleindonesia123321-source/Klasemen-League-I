<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAGAM PENGHARGAAN | FOOTBALL LEAGUE-I</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37; --silver: #aaa9ad; --bronze: #cd7f32;
            --dark: #0a0a0a; --white: #ffffff;
            --afc-purple: #4a148c;
        }
        body { background: #222; font-family: 'Kanit', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 0; }
        
        .certificate {
            width: 277mm; height: 190mm; background: var(--white);
            position: relative; border: 20px solid var(--dark);
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5); overflow: hidden; color: var(--dark);
            margin-bottom: 50px; padding: 30px; box-sizing: border-box;
        }

        .inner-border { position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border: 2px solid var(--dark); pointer-events: none; }
        .corner { position: absolute; width: 120px; height: 120px; border: 10px solid var(--gold); z-index: 10; }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }

        .header { margin-top: 25px; text-transform: uppercase; letter-spacing: 6px; font-weight: 400; font-size: 14px; opacity: 0.8; }
        
        /* JUDUL DIPERTEGAS */
        .award-title { font-family: 'Playfair Display', serif; font-size: 48px; margin: 10px 0; color: var(--gold); text-transform: uppercase; text-align: center; width: 90%; line-height: 1; font-weight: 900; letter-spacing: 1px; }
        
        /* LOGO/PIALA LEBIH BESAR & PROPORSIONAL */
        .trophy-container { height: 210px; margin: 15px 0; display: flex; gap: 20px; align-items: center; justify-content: center; z-index: 5; }
        .trophy-container img { height: 100%; width: auto; object-fit: contain; filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.15)); mix-blend-mode: multiply; }

        .presented-to { margin-top: 25px; font-size: 24px; font-style: italic; font-family: 'Libre Baskerville', serif; color: #555; }
        
        /* NAMA PEMENANG SANGAT MENONJOL */
        .winner-name { 
            font-family: 'Libre Baskerville', serif; 
            font-size: 68px; 
            font-weight: 700; 
            margin: 5px 0; 
            text-transform: uppercase; 
            color: #111; 
            text-align: center;
            letter-spacing: 3px;
            border-bottom: 3px solid #eee;
            padding-bottom: 5px;
            min-width: 75%;
        }

        .ballon-text { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; color: var(--gold); font-size: 20px; margin-top: 5px; }

        .league-name { font-weight: 900; color: #1e40af; margin-top: 15px; font-size: 28px; letter-spacing: 2px; }
        .description { width: 70%; text-align: center; font-size: 16px; margin-top: 10px; line-height: 1.5; color: #333; }

        /* FOOTER SETTINGS - TTD DIPERBESAR PROFESIONAL */
        .footer { margin-top: auto; margin-bottom: 25px; display: flex; justify-content: space-around; width: 100%; position: relative; }
        .sig-box { text-align: center; width: 300px; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        .sig-img { height: 140px; width: auto; margin-bottom: -45px; z-index: 2; mix-blend-mode: multiply; filter: contrast(1.1); }
        
        .stamp-img { 
            position: absolute; 
            width: 100px; 
            height: auto; 
            bottom: 40px; 
            left: 65%; 
            z-index: 1; 
            opacity: 0.85; 
            mix-blend-mode: multiply;
        }

        .sig-line { border-top: 2.5px solid var(--dark); width: 100%; padding-top: 8px; font-weight: bold; font-size: 18px; text-transform: uppercase; z-index: 3; letter-spacing: 1px; }
        .sig-role { font-size: 13px; color: #444; margin-top: 3px; font-weight: 400; }
        
        /* VARIAN WARNA */
        .cert-juara2 .award-title { color: var(--silver); } .cert-juara2 .corner { border-color: var(--silver); }
        .cert-juara3 .award-title { color: var(--bronze); } .cert-juara3 .corner { border-color: var(--bronze); }
        .cert-topscorer .award-title { color: #cc0000; } .cert-topscorer .corner { border-color: #cc0000; }
        .cert-poty .award-title { color: #1e40af; } .cert-poty .corner { border-color: #1e40af; }
        .cert-witness .award-title { color: #546e7a; } .cert-witness .corner { border-color: #546e7a; }
        .cert-fairplay .award-title { color: #2e7d32; } .cert-fairplay .corner { border-color: #2e7d32; }
        .cert-afc .award-title { color: var(--afc-purple); } .cert-afc .corner { border-color: var(--afc-purple); }
        .cert-staff .award-title { color: #ffbf00; } .cert-staff .corner { border-color: #ffbf00; }

        .btn-print {
            position: fixed; top: 20px; left: 20px; padding: 15px 30px;
            background: #00f2ff; border: none; font-weight: bold; cursor: pointer;
            border-radius: 5px; z-index: 100; font-family: 'Kanit'; font-size: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @media print { 
            @page { size: A4 landscape; margin: 0; }
            body { background: none; padding: 0; margin: 0; } 
            .certificate { 
                box-shadow: none; page-break-after: always; margin: 0; 
                border: 15px solid var(--dark); 
                width: 297mm; height: 210mm;
            } 
            .btn-print { display: none; } 
        }
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">📥 SIMPAN PIAGAM (PDF)</button>
    <div id="loading" style="color: white; margin-top: 100px;">🔄 MEMPROSES PIAGAM PROFESIONAL...</div>
    <div id="certificates-container"></div>

    <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=0&single=true&output=csv';

    const NAMA_SAKSI_TERBAIK = "No Valuable Name"; 
    const NAMA_FAIR_PLAY = "No Valuable Name";
    const NAMA_AFC_ELITE = "MAYA"; 
    const NAMA_STAFF_TERBAIK = "REGI"; 

    const assets = {
        piala: 'assets/piala.png', emas: 'assets/emas.png', perak: 'assets/perak.png',
        perunggu: 'assets/perunggu.png', sepatu: 'assets/sepatu.png', bola: 'assets/bola.png',
        saksi: 'assets/saksi.png', fairplay: 'assets/fairplay.png', afc: 'assets/afc.png',
        admin: 'assets/admin.png', ttdRegi: 'assets/ttdregi.png', ttdRizal: 'assets/ttdrizal.png', cap: 'assets/cap.png'
    };

    async function generateCertificates() {
        try {
            const forceUpdate = new Date().getTime();
            const res = await fetch(`${sheetUrl}&t=${forceUpdate}`);
            const csv = await res.text();
            
            let players = csv.split('\n').slice(1).map(line => {
                const row = line.split(',').map(c => c.trim().replace(/"/g, ''));
                return { nama: row[0], point: parseInt(row[1]) || 0, goals: parseInt(row[2]) || 0, potw_winner: parseInt(row[5]) || 0 };
            }).filter(p => p.nama);

            const container = document.getElementById('certificates-container');
            container.innerHTML = ""; 
            document.getElementById('loading').style.display = 'none';

            const rankWinners = [...players].sort((a, b) => b.point - a.point || b.goals - a.goals);
            const scorerWinners = [...players].sort((a, b) => b.goals - a.goals);
            const maxPotwValue = Math.max(...players.map(p => p.potw_winner));
            const topPotyWinners = players.filter(p => p.potw_winner === maxPotwValue && maxPotwValue > 0);

            const awards = [
                { type: 'cert-juara1', imgs: [assets.piala, assets.emas], title: '1st PLACE CHAMPION', name: rankWinners[0]?.nama || "N/A", desc: 'Atas prestasi luar biasa menjadi pemuncak klasemen akhir musim.' },
                { type: 'cert-juara2', imgs: [assets.perak], title: '2nd PLACE RUNNER UP', name: rankWinners[1]?.nama || "N/A", desc: 'Atas perjuangan luar biasa meraih posisi kedua pada kompetisi musim ini.' },
                { type: 'cert-juara3', imgs: [assets.perunggu], title: '3rd PLACE WINNER', name: rankWinners[2]?.nama || "N/A", desc: 'Atas keberhasilan menempati posisi tiga besar pada kompetisi musim ini.' },
                { type: 'cert-topscorer', imgs: [assets.sepatu], title: 'GOLDEN BOOT (TOP SCORER)', name: scorerWinners[0]?.nama || "N/A", desc: `Pencetak gol terbanyak dengan koleksi ${scorerWinners[0]?.goals || 0} gol.` }
            ];

            awards.forEach(data => renderCard(container, data));
            topPotyWinners.forEach(winner => {
                renderCard(container, { type: 'cert-poty', imgs: [assets.bola], title: 'PLAYER OF THE YEAR', name: winner.nama, isBallon: true, desc: `Penghargaan tertinggi individu sebagai pemain terbaik sepanjang musim bergulir.` });
            });

            renderCard(container, { type: 'cert-witness', imgs: [assets.saksi], title: 'BEST WITNESS', name: NAMA_SAKSI_TERBAIK, desc: 'Penghargaan atas dedikasi dan integritas dalam menyaksikan serta mengawasi setiap prosedur kompetisi agar berjalan sesuai regulasi.' });
            renderCard(container, { type: 'cert-fairplay', imgs: [assets.fairplay], title: 'FAIR PLAY TROPHY', name: NAMA_FAIR_PLAY, desc: 'Penghargaan ini diberikan kepada individu yang menunjukkan perilaku sportif, disiplin tinggi, menghormati lawan, serta mematuhi peraturan permainan.' });
            renderCard(container, { type: 'cert-afc', imgs: [assets.afc], title: 'AFC 2 ELITE TROPHY', name: NAMA_AFC_ELITE, desc: 'Penghargaan bergengsi atas pencapaian luar biasa dan dominasi teknis dalam turnamen kasta elit AFC tingkat kedua.' });
            renderCard(container, { type: 'cert-staff', imgs: [assets.admin], title: 'BEST SPECIAL STAFF AWARD', name: NAMA_STAFF_TERBAIK, desc: 'Penghargaan atas loyalitas, dedikasi tinggi, dan kontribusi teknis luar biasa dalam menyukseskan operasional Football League-I musim ini.' });

        } catch (e) { 
            document.getElementById('loading').innerText = "❌ GAGAL MEMUAT DATA!";
        }
    }

    function renderCard(container, data) {
        let imagesHTML = data.imgs.map(url => `<img src="${url}" alt="award">`).join('');
        let extraText = data.isBallon ? `<div class="ballon-text">🏆 Ballon d'Or Winner 🏆</div>` : '';

        container.innerHTML += `
            <div class="certificate ${data.type}">
                <div class="inner-border"></div>
                <div class="corner top-left"></div><div class="corner top-right"></div>
                <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
                
                <div class="header">Official Achievement</div>
                <div class="award-title">${data.title}</div>
                
                <div class="trophy-container">${imagesHTML}</div>

                <div class="presented-to">Diberikan Kepada:</div>
                <div class="winner-name">${data.name}</div>
                ${extraText}
                <div class="league-name">FOOTBALL LEAGUE-I</div>
                
                <div class="description">${data.desc}</div>
                
                <div class="footer">
                    <div class="sig-box">
                        <img src="${assets.ttdRegi}" class="sig-img" alt="TTD">
                        <div class="sig-line">Regi Hidayat Putra</div>
                        <div class="sig-role">Official Admin</div>
                    </div>
                    <div class="sig-box">
                        <img src="${assets.cap}" class="stamp-img" alt="CAP">
                        <img src="${assets.ttdRizal}" class="sig-img" alt="TTD">
                        <div class="sig-line">Muhammad Rizal Amar</div>
                        <div class="sig-role">League Manager</div>
                    </div>
                </div>
            </div>
        `;
    }

    generateCertificates();
    </script>
</body>
</html>
