<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAGAM PENGHARGAAN | FOOTBALL LEAGUE-I</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37; --silver: #aaa9ad; --bronze: #cd7f32;
            --dark: #0a0a0a; --white: #ffffff;
            --afc-purple: #4a148c; /* Warna nuansa AFC Elite */
        }
        body { background: #222; font-family: 'Kanit', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 50px; padding: 50px 0; }
        
        /* UKURAN STANDAR LAYAR */
        .certificate {
            width: 277mm; height: 190mm; background: var(--white);
            position: relative; border: 20px solid var(--dark);
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5); overflow: hidden; color: var(--dark);
            margin-bottom: 50px;
            box-sizing: border-box; /* Mencegah border menambah ukuran elemen */
        }

        .inner-border { position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px; border: 2px solid var(--dark); pointer-events: none; }
        .corner { position: absolute; width: 100px; height: 100px; border: 8px solid var(--gold); }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }

        /* KONTEN LOGO DI-SET SESUAI MAU LO (PERBESAR) */
        .trophy-container { height: 115px; margin-top: 60px; display: flex; gap: 15px; align-items: center; justify-content: center; z-index: 5; }
        .trophy-container img {
            height: 150%; /* Sesuai permintaan: Logo Diperbesar */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            mix-blend-mode: multiply; 
        }

        .header { margin-top: 35px; text-transform: uppercase; letter-spacing: 5px; font-weight: 400; font-size: 13px; }
        .award-title { font-family: 'Playfair Display', serif; font-size: 34px; margin: 5px 0; color: var(--gold); text-transform: uppercase; text-align: center; width: 85%; line-height: 1.1; font-weight: 900; }
        
        .presented-to { margin-top: 40px; font-size: 16px; font-style: italic; font-family: 'Libre Baskerville', serif; }
        
        .winner-name { 
            font-family: 'Libre Baskerville', serif; 
            font-size: 42px; 
            font-weight: 700; 
            margin: 5px 0; 
            text-transform: uppercase; 
            color: #111; 
            text-align: center;
            letter-spacing: 2px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
            min-width: 60%;
        }

        .ballon-text {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            color: var(--gold);
            font-size: 18px;
            margin-top: -5px;
            letter-spacing: 1px;
        }

        .league-name { font-weight: 900; color: #1e40af; margin-top: 8px; font-size: 20px; letter-spacing: 1px; }
        .description { width: 80%; text-align: center; font-size: 14px; margin-top: 10px; line-height: 1.4; color: #444; }

        /* FOOTER & TTD (DI-SET SESUAI MAU LO: PERBESAR) */
        .footer { margin-top: auto; margin-bottom: 20px; display: flex; justify-content: space-around; width: 100%; position: relative; }
        .sig-box { text-align: center; width: 220px; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        .sig-img { height: 150px; width: auto; margin-bottom: -25px; z-index: 2; mix-blend-mode: multiply; }
        
        .stamp-img { 
            position: absolute; 
            width: 75px; 
            height: auto; 
            bottom: 45px; 
            left: 60%; 
            z-index: 1; 
            opacity: 0.8; 
            mix-blend-mode: multiply;
        }

        .sig-line { border-top: 2px solid var(--dark); width: 100%; padding-top: 5px; font-weight: bold; font-size: 14px; text-transform: uppercase; z-index: 3; }
        .sig-role { font-size: 11px; color: #444; text-transform: none; margin-top: 2px; font-weight: normal; }
        
        /* WARNA VARIAN */
        .cert-juara2 .award-title { color: var(--silver); } .cert-juara2 .corner { border-color: var(--silver); }
        .cert-juara3 .award-title { color: var(--bronze); } .cert-juara3 .corner { border-color: var(--bronze); }
        .cert-topscorer .award-title { color: #cc0000; } .cert-topscorer .corner { border-color: #cc0000; }
        .cert-poty .award-title { color: #1e40af; } .cert-poty .corner { border-color: #1e40af; }
        .cert-witness .award-title { color: #546e7a; } .cert-witness .corner { border-color: #546e7a; }
        .cert-fairplay .award-title { color: #2e7d32; } .cert-fairplay .corner { border-color: #2e7d32; }
        .cert-afc .award-title { color: var(--afc-purple); } .cert-afc .corner { border-color: var(--afc-purple); }
        .cert-staff .award-title { color: #ffbf00; } .cert-staff .corner { border-color: #ffbf00; }
        .cert-puskas .award-title { color: #ff5722; } .cert-puskas .corner { border-color: #ff5722; }

        /* WARNA KHUSUS WORLD CUP EDITION */
        .cert-wc-1 .award-title { color: #ffca28; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); } 
        .cert-wc-1 .corner { border-color: #ffca28; }
        .cert-wc-1 .inner-border { border-color: #ffca28; opacity: 0.3; }
        
        .cert-wc-2 .award-title { color: #e0e0e0; } 
        .cert-wc-2 .corner { border-color: #e0e0e0; }
        
        .cert-wc-3 .award-title { color: #b87333; } 
        .cert-wc-3 .corner { border-color: #b87333; }
        
        .btn-print {
            position: fixed; top: 20px; left: 20px; padding: 12px 25px;
            background: #00f2ff; border: none; font-weight: bold; cursor: pointer;
            border-radius: 5px; z-index: 100; font-family: 'Kanit'; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* FIX PRINT: SUPAYA FIT A4 TANPA MENGUBAH UKURAN ELEMEN DI ATAS */
        @media print { 
            @page {
                size: A4 landscape;
                margin: 0;
            }
            body { background: none; padding: 0; margin: 0; gap: 0; } 
            .certificate { 
                box-shadow: none; 
                page-break-after: always; 
                margin: 0; 
                border: 15px solid var(--dark); 
                width: 297mm; 
                height: 210mm;
                /* Skalasi otomatis agar semua elemen besar muat dalam satu lembar */
                transform: scale(1); 
                transform-origin: center;
            } 
            .btn-print, #loading { display: none; } 
        }
        /* TAMBAHAN BIAR FIT DI HP */
@media screen and (max-width: 768px) {
    body { 
        padding: 20px 10px; 
        gap: 20px; 
    }
    .certificate {
        width: 95vw; /* Lebar sertifikat jadi 95% lebar layar HP */
        height: auto; /* Tinggi menyesuaikan proporsi */
        min-height: 250px;
        border-width: 10px; /* Border dikecilkan dikit buat HP */
        margin-bottom: 20px;
    }
    .award-title { font-size: 1.2rem; }
    .winner-name { font-size: 1.5rem; }
    .trophy-container { height: 60px; margin-top: 30px; }
    .sig-img { height: 60px; }
    .sig-line { font-size: 10px; }
    .description { font-size: 10px; }
}
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">📥 SIMPAN PIAGAM (PDF)</button>
    <div id="loading" style="color: white; margin-top: 100px;">🔄 MEMPROSES DATA...</div>
    <div id="certificates-container"></div>

    <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4v_ziMtwhRpQxS5ZnIbO9olIrUlzAAx8X5kS_Yr-Mv_GqDqSsg4Lc-1YNugRqElvUClbXnsf5gu12/pub?gid=0&single=true&output=csv';

    const NAMA_SAKSI_TERBAIK = "ARIES"; 
    const NAMA_FAIR_PLAY = "DANDI";
    const NAMA_AFC_ELITE = "MAYA"; 
    const NAMA_STAFF_TERBAIK = "REGI"; 
    const NAMA_PUSKAS_WINNER = "DICKY"; // Ganti nama pemenang Puskas Award

    const assets = {
        pialadunia: 'assets/pialadunia.png',
        plakatperak: 'assets/plakatperak.png',
        plakatperunggu: 'assets/plakatperunggu.png',
        piala: 'assets/piala.png',
        emas: 'assets/emas.png',
        perak: 'assets/perak.png',
        perunggu: 'assets/perunggu.png',
        sepatu: 'assets/sepatu.png',
        bola: 'assets/bola.png',
        saksi: 'assets/saksi.png',
        fairplay: 'assets/fairplay.png',
        afc: 'assets/afc.png',
        admin: 'assets/admin.png',
        puskas: 'assets/puskas.png', // Pastikan file puskas.png ada di folder assets
        ttdRegi: 'assets/ttdregi.png',
        ttdRizal: 'assets/ttdrizal.png',
        cap: 'assets/cap.png'
    };

    async function generateCertificates() {
        try {
            const forceUpdate = new Date().getTime();
            const res = await fetch(`${sheetUrl}&t=${forceUpdate}`);
            const csv = await res.text();
            
            let players = csv.split('\n').slice(1).map(line => {
                const row = line.split(',').map(c => c.trim().replace(/"/g, ''));
                return { 
                    nama: row[0], 
                    point: parseInt(row[1]) || 0, 
                    goals: parseInt(row[2]) || 0,
                    potw_winner: parseInt(row[5]) || 0 
                };
            }).filter(p => p.nama);

            const container = document.getElementById('certificates-container');
            container.innerHTML = ""; 
            document.getElementById('loading').style.display = 'none';

            const rankWinners = [...players].sort((a, b) => b.point - a.point || b.goals - a.goals);
            const scorerWinners = [...players].sort((a, b) => b.goals - a.goals);
            const maxPotwValue = Math.max(...players.map(p => p.potw_winner));
            const topPotyWinners = players.filter(p => p.potw_winner === maxPotwValue && maxPotwValue > 0);

            const awards = [
                { type: 'cert-juara1', imgs: [assets.piala, assets.emas], title: '1st PLACE CHAMPION', name: rankWinners[0]?.nama || "N/A", desc: 'Atas prestasi luar biasa menjadi pemuncak klasemen akhir musim.' },
                { type: 'cert-juara2', imgs: [assets.perak], title: '2nd PLACE RUNNER UP', name: rankWinners[1]?.nama || "N/A", desc: 'Atas perjuangan luar biasa meraih posisi kedua pada kompetisi musim ini.' },
                { type: 'cert-juara3', imgs: [assets.perunggu], title: '3rd PLACE WINNER', name: rankWinners[2]?.nama || "N/A", desc: 'Atas keberhasilan menempati posisi tiga besar pada kompetisi musim ini.' },
                { type: 'cert-topscorer', imgs: [assets.sepatu], title: 'GOLDEN BOOT (TOP SCORER)', name: scorerWinners[0]?.nama || "N/A", desc: `Pencetak gol terbanyak dengan koleksi ${scorerWinners[0]?.goals || 0} gol.` }
            ];

            // --- TAMBAHAN PIAGAM WORLD CUP EDITION ---
            const wcAwards = [
                { 
                    type: 'cert-wc-1', 
                    imgs: [assets.pialadunia, assets.emas], 
                    title: 'WORLD CUP 2026 - 1st PLACE', 
                    name: 'NAMA_PEMENANG_DI_SINI', // Ganti Nama Pemenang Juara 1
                    desc: 'Atas pencapaian legendaris menjadi Juara Utama dalam turnamen WORLD CUP 2026 EDITION dengan membawa negara [NAMA_NEGARA].' 
                },
                { 
                    type: 'cert-wc-2', 
                    imgs: [assets.plakatperak], 
                    title: 'WORLD CUP 2026 - 2nd PLACE', 
                    name: 'NAMA_PEMENANG_DI_SINI', // Ganti Nama Pemenang Juara 2
                    desc: 'Atas perjuangan luar biasa meraih posisi Runner-Up dalam turnamen WORLD CUP 2026 EDITION bersama negara [NAMA_NEGARA].' 
                },
                { 
                    type: 'cert-wc-3', 
                    imgs: [assets.plakatperunggu], 
                    title: 'WORLD CUP 2026 - 3rd PLACE', 
                    name: 'NAMA_PEMENANG_DI_SINI', // Ganti Nama Pemenang Juara 3
                    desc: 'Atas keberhasilan meraih medali perunggu dan posisi ketiga dalam turnamen WORLD CUP 2026 EDITION bersama negara [NAMA_NEGARA].' 
                }
            ];
            
            // Render piagam World Cup dulu paling atas
            wcAwards.forEach(data => renderCard(container, data));
            // ------------------------------------------

            awards.forEach(data => renderCard(container, data));

            topPotyWinners.forEach(winner => {
                renderCard(container, {
                    type: 'cert-poty',
                    imgs: [assets.bola],
                    title: 'PLAYER OF THE YEAR',
                    name: winner.nama,
                    isBallon: true,
                    desc: `Penghargaan tertinggi individu sebagai pemain terbaik sepanjang musim bergulir.`
                });
            });

            renderCard(container, {
                type: 'cert-witness',
                imgs: [assets.saksi],
                title: 'BEST WITNESS',
                name: NAMA_SAKSI_TERBAIK,
                desc: 'Penghargaan atas dedikasi dan integritas dalam menyaksikan serta mengawasi setiap prosedur kompetisi agar berjalan sesuai regulasi.'
            });

            renderCard(container, {
                type: 'cert-fairplay',
                imgs: [assets.fairplay],
                title: 'FAIR PLAY TROPHY',
                name: NAMA_FAIR_PLAY,
                desc: 'Penghargaan ini diberikan kepada individu yang menunjukkan perilaku sportif, disiplin tinggi, menghormati lawan, serta mematuhi peraturan permainan.'
            });

            renderCard(container, {
                type: 'cert-afc',
                imgs: [assets.afc],
                title: 'AFC 2 ELITE TROPHY',
                name: NAMA_AFC_ELITE,
                desc: 'Penghargaan bergengsi atas pencapaian luar biasa dan dominasi teknis dalam turnamen kasta elit AFC tingkat kedua.'
            });

            renderCard(container, {
                type: 'cert-staff',
                imgs: [assets.admin],
                title: 'BEST SPECIAL STAFF AWARD',
                name: NAMA_STAFF_TERBAIK,
                desc: 'Penghargaan atas loyalitas, dedikasi tinggi, dan kontribusi teknis luar biasa dalam menyukseskan operasional Football League-I musim ini.'
            });

            // --- TAMBAHAN PUSKAS AWARD ---
            renderCard(container, {
                type: 'cert-puskas',
                imgs: [assets.puskas],
                title: 'PUSKAS TROPHY (BEST SCORES)',
                name: NAMA_PUSKAS_WINNER,
                desc: 'Diberikan atas terciptanya gol terbaik yang spektakuler, estetik, dan ikonik pada laga Psbs biak vs Dewa United Dengan skor 0-5, tanggal 08 May 2026.'
            });

        } catch (e) { 
            console.error("Error:", e); 
            document.getElementById('loading').innerText = "❌ GAGAL MEMUAT DATA!";
        }
    }

    function renderCard(container, data) {
        let imagesHTML = data.imgs && data.imgs.length > 0 
            ? data.imgs.map(url => `<img src="${url}" alt="award">`).join('') 
            : `<div style="font-size: 80px; margin-bottom: 10px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));">${data.customIcon || '🏆'}</div>`;
            
        let extraText = data.isBallon ? `<div class="ballon-text">🏆 Ballon d'Or Winner 🏆</div>` : '';

        container.innerHTML += `
            <div class="certificate ${data.type}">
                <div class="inner-border"></div>
                <div class="corner top-left"></div><div class="corner top-right"></div>
                <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
                
                <div class="header">Official Achievement</div>
                <div class="award-title">${data.title}</div>
                
                <div class="trophy-container">
                    ${imagesHTML}
                </div>

                <div class="presented-to">Diberikan Kepada:</div>
                <div class="winner-name">${data.name}</div>
                ${extraText}
                <div class="league-name">FOOTBALL LEAGUE-I</div>
                
                <div class="description">${data.desc}</div>
                
                <div class="footer">
                    <div class="sig-box">
                        <img src="${assets.ttdRegi}" class="sig-img" alt="TTD">
                        <div class="sig-line">Regi Hidayat Putra</div>
                        <div class="sig-role">Official Admin</div>
                    </div>
                    <div class="sig-box">
                        <img src="${assets.cap}" class="stamp-img" alt="CAP">
                        <img src="${assets.ttdRizal}" class="sig-img" alt="TTD">
                        <div class="sig-line">Muhammad Rizal Amar</div>
                        <div class="sig-role">League Manager</div>
                    </div>
                </div>
            </div>
        `;
    }

    generateCertificates();
    </script>
</body>
</html>
